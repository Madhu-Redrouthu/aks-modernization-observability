apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-demo-service
  namespace: prod-apps
  labels:
    app: aks-demo-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aks-demo-service
  template:
    metadata:
      labels:
        app: aks-demo-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: aks-demo-service
          image: <ACR_LOGIN_SERVER>/aks-demo-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: APP_VERSION
              value: "1.0.0"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
